services:
  http:
    build:
      context: .
      dockerfile: ./dockers/http.docker
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
      - "8080:8080"
      - "8443:8443"
      - "9443:9443"
    volumes:
      - ./dockers/http/server.py:/opt/server.py
      - ./dockers/http/server.pem:/opt/server.pem
    networks:
      - test
networks:
  test:
    driver: bridge
    ipam:
      driver: default